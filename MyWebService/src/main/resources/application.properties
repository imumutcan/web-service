spring.application.name=MyWebService
server.port=8080

# Gizli degerler (DB sifresi, JWT anahtari, mail sifresi) proje kokundeki .env dosyasindan okunur.
# .env dosyasi GitHub'a yuklenmez. Ornek icin .env.example dosyasina bakiniz.
spring.config.import=optional:file:.env[.properties]

# Veritabani Baglanti Bilgileri
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mywebservice_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Ayarlari
# "create" her baslangicta tablolari silip yeniden olusturuyordu; "update" verileri korur.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mesaj dosyalari (Messages.properties, Messages_tr.properties ...)
# Spring varsayilan olarak "messages" (kucuk harf) arar. Buyuk/kucuk harf duyarli
# sistemlerde (Linux, jar icinde) dosyalarin bulunabilmesi icin acikca belirtildi.
spring.messages.basename=Messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT Ayarlari (jwt-auth-api projesinden tasindi)
# 15 dakika
jwt.access-token-expiration-ms=900000
# 7 gun
jwt.refresh-token-expiration-ms=604800000
jwt.secret-key=${JWT_SECRET}

# Dosya Yukleme (profil resmi)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Aktivasyon linkinde kullanilacak on yuz adresi
app.client-url=${CLIENT_URL:http://localhost:5173}

# Email Ayarlari
spring.mail.host=smtp.ethereal.email
spring.mail.username=${SPRING_MAIL_USERNAME:jake.stehr@ethereal.email}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
